<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' http://0.0.0.0:35729 http://localhost:35729;">
  <title>h5pal</title>
  <link rel="apple-touch-startup-image" href="pal.ico" />
  <link rel="apple-touch-icon" href="pal.ico"/>
  <link rel="stylesheet" type="text/css" href="css/h5pal.css">
</head>
<body class="page">
  <div class="ui content">
    <div id="wrap">
      <canvas id="cvs"></canvas>
      <canvas id="debug"></canvas>
      <div id="debugLayer"></div>
      <div id="pal-overview-layer"></div>
      <div id="pal-overview-veil"></div>
      <audio autoplay loop id="bg-music">
        <source id="bg-music-source" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
  </div>
  <script>
  (function bootstrapPalConfig() {
    function readParentConfig() {
      try {
        if (window !== window.parent && window.parent && window.parent.__PAL_GAME_CONFIG) {
          return window.parent.__PAL_GAME_CONFIG;
        }
      } catch (err) {
        console.warn('[h5pal] unable to read parent config', err);
      }
      return null;
    }
    var injected = window.PAL_CONFIG || readParentConfig() || {};
    var defaultMudConfig = {
      rpcUrl: "http://127.0.0.1:8545",
      wsUrl: "ws://127.0.0.1:8545",
      worldAddress: "0x012a31a98Ea3D2611E281f88899b6b52eACF00c0",
      privateKey: null
    };
    var mergedMud = Object.assign({}, defaultMudConfig, injected.mud || {});
    var defaults = {
      assetBaseUrl: "./pal-assets/",
      audioBaseUrl: "./pal-assets/MP3/",
      enableAudio: true,
      enableOverviewMode: true,
      enablePanorama: true,
      mapOverlayMode: "gps",
      enableMud: true,
      enableNPCBehaviours: false,
      llmModel: null,
      npcLLM: {}
    };
    var merged = Object.assign({}, defaults, injected);
    merged.mud = mergedMud;
    merged.npcLLM = Object.assign({}, injected.npcLLM || {});
    window.PAL_CONFIG = merged;
  })();
  </script>
  <script src="lib/requirejs/require.js"></script>
  <script>
  require.config({
    urlArgs: 'bust=' + Date.now(),
    baseUrl: 'js',
    waitSeconds: 5,
    paths: {
      'jquery': '../lib/jquery/jquery.min',
      'q': '../lib/q/q',
      'sprintf': '../lib/sprintf/sprintf.min',
      'co': '../lib/co/co',
      'pal/co': '../src/js/pal/co.ts',
      'pal/co.ts': '../src/js/pal/co.ts',
      'rxjs': '../lib/rxjs/rxjs.umd.min',
      'rxjs/operators': '../lib/rxjs/rxjs.operators',
      '@latticexyz/recs': '../lib/mud/pal-mud-recs',
      '@latticexyz/store-sync': '../lib/mud/pal-mud-store-sync',
      'viem': '../lib/mud/pal-mud-viem',
      'pal/binary-helper': '../src/js/pal/binary-helper.ts',
      'pal/binary-helper.ts': '../src/js/pal/binary-helper.ts'
    },
    shim: {
      'semantic-ui': {
        deps: ['jquery']
      },
      'pal/binary-helper': {
        deps: ['shim']
      },
      'pal/pal-global': {
        deps: ['pal/common']
      },
      'pal/common': {
        deps: ['pal/binary-helper']
      },
      'pal/script_extras': {
        deps: ['pal/script']
      },
      'h5pal': {
        deps: ['jquery', 'sprintf', 'shim', 'pal/common', 'pal/pal-global', 'pal/utils']
      }
    }
  });
  </script>
  <script>
  require(['jquery', 'h5pal'], function(pal) {
    const cheatKeys = ['invincible', 'superAttack', 'superDefense'];
    const cheatVarMap = cheatKeys.reduce((map, key) => {
      map[key] = key.replace(/[A-Z]/g, function ($0) { return '_' + $0; }).toUpperCase();
      return map;
    }, {});
    const coroutineRunner = typeof window.co === 'function' ? window.co : null;

    function ensureCheat(key) {
      const variable = cheatVarMap[key];
      if (!variable || typeof window[variable] === 'undefined') {
        throw new Error('Unknown cheat flag: ' + key);
      }
      return variable;
    }

    function setCheatState(key, enabled) {
      const variable = ensureCheat(key);
      window[variable] = !!enabled;
      return !!window[variable];
    }

    function getCheatState(key) {
      const variable = cheatVarMap[key];
      if (!variable || typeof window[variable] === 'undefined') {
        return null;
      }
      return !!window[variable];
    }

    function runCoroutine(task) {
      if (typeof coroutineRunner === 'function') {
        return coroutineRunner(task);
      }
      return Promise.reject(new Error('Coroutine runner unavailable'));
    }

    window.PAL_UI = Object.assign({}, window.PAL_UI || {}, {
      saveGame(slot = 1) {
        return runCoroutine(function* () {
          if (typeof window.game?.saveGame !== 'function') {
            throw new Error('game.saveGame unavailable');
          }
          const targetSlot = Number(slot) || 1;
          return window.game.saveGame(targetSlot);
        });
      },
      loadGame(slot = 1) {
        return runCoroutine(function* () {
          if (typeof window.game?.initGameData !== 'function') {
            throw new Error('game.initGameData unavailable');
          }
          const targetSlot = Number(slot) || 1;
          yield window.game.initGameData(targetSlot);
          return true;
        });
      },
      connectWallet(requestOpts = {}) {
        if (!window.mudBridge || typeof window.mudBridge.connectWallet !== 'function') {
          return Promise.reject(new Error('Mud services not ready'));
        }
        return window.mudBridge.connectWallet(requestOpts);
      },
      disconnectWallet() {
        if (window.mudBridge && typeof window.mudBridge.disconnectWallet === 'function') {
          return window.mudBridge.disconnectWallet();
        }
        console.warn('[PAL_UI] disconnectWallet not implemented; resetting UI state only');
        return Promise.resolve(true);
      },
      setCheatState(key, enabled) {
        return setCheatState(key, enabled);
      },
      getCheatState(key) {
        return getCheatState(key);
      },
      cheatKeys: cheatKeys.slice()
    });

    try {
      window.dispatchEvent(new CustomEvent('pal-ui-ready', { detail: { cheatKeys } }));
    } catch (err) { /* ignore */ }
  });
  </script>
</body>
</html>
