<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' http://0.0.0.0:35729 http://localhost:35729;">
  <title>h5pal</title>
  <link rel="apple-touch-startup-image" href="pal.ico" />
  <link rel="apple-touch-icon" href="pal.ico"/>
  <link rel="stylesheet" type="text/css" href="css/h5pal.css">
</head>
<body class="page">
  <div class="ui content">
    <div id="wrap">
      <canvas id="cvs"></canvas>
      <canvas id="debug"></canvas>
      <div id="debugLayer"></div>
      <audio autoplay loop id="bg-music">
        <source id="bg-music-source" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
    <div class="control-panel">
      <input type="button" id="save" value="SAVE" />
      <input type="button" id="load" value="LOAD" />
      <input type="button" id="connect-wallet" value="Connect Wallet" style="display:none" />
      <label for="invincible">无敌<input type="checkbox" id="invincible" /></label>
      <label for="superAttack">超强攻击力<input type="checkbox" id="superAttack" /></label>
      <label for="superDefense">超强防御力<input type="checkbox" id="superDefense" /></label>
    </div>
  </div>
  <script>
  window.PAL_CONFIG = {
    assetBaseUrl: "./pal-assets/",
    audioBaseUrl: "./pal-assets/MP3/",
    enableAudio: true,
    enableOverviewMode: true,
    enableMud: true,
    mud: {
      rpcUrl: "http://127.0.0.1:8545",
      wsUrl: "ws://127.0.0.1:8545",
      worldAddress: "0x012a31a98Ea3D2611E281f88899b6b52eACF00c0",
      privateKey: null
    }
  };
  </script>
  <script src="lib/requirejs/require.js"></script>
  <script>
  require.config({
    baseUrl: 'js',
    waitSeconds: 5,
    paths: {
      'jquery': '../lib/jquery/jquery.min',
      'q': '../lib/q/q',
      'sprintf': '../lib/sprintf/sprintf.min',
      'co': '../lib/co/co',
      'rxjs': '../lib/rxjs/rxjs.umd.min',
      'rxjs/operators': '../lib/rxjs/rxjs.operators',
      '@latticexyz/recs': '../lib/mud/pal-mud-recs',
      '@latticexyz/store-sync': '../lib/mud/pal-mud-store-sync',
      'viem': '../lib/mud/pal-mud-viem'
    },
    shim: {
      'semantic-ui': {
        deps: ['jquery']
      },
      'pal/binary-helper': {
        deps: ['shim']
      },
      'pal/pal-global': {
        deps: ['pal/common']
      },
      'pal/common': {
        deps: ['pal/binary-helper']
      },
      'pal/script_extras': {
        deps: ['pal/script']
      },
      'h5pal': {
        deps: ['jquery', 'sprintf', 'shim', 'pal/common', 'pal/pal-global', 'pal/utils']
      }
    }
  });
  </script>
  <script>
  require(['jquery', 'h5pal'], function(pal) {
    $('#save').click(function() {
      var me = $(this), text = me.val();
      me.val(text + '...');
      co(function*() {
        var ok = game.saveGame(1);
        me.val(ok ? text + '...Done!' : text + '...Failed');
        yield sleep(1000);
        me.val(text);
      })
    });
    $('#load').click(function() {
      co(function*() {
        try {
          yield game.initGameData(1);
        } catch(ex) {
          alert('failed');
        }
      });
    });
    $.fn.checked = function(f) {
      if (typeof f === 'undefined') {
        return $(this).prop('checked');
      }
      return $(this).prop('checked', f);
    };
    ['invincible', 'superAttack', 'superDefense'].forEach(function(key) {
      var variable = key.replace(/[A-Z]/g, function($0) { return '_' + $0; }).toUpperCase();
      var checkbox = $('#' + key);
      checkbox.checked(window[variable]);
      checkbox.change(function(e) {
        var me = $(this);
        window[variable] = me.checked();
      });
    });

    var mudEnabled = window.PAL_CONFIG && window.PAL_CONFIG.enableMud === true;
    if (mudEnabled) {
      $('#connect-wallet').show();
      $('#connect-wallet').click(async function () {
        if (!window.mudBridge || typeof window.mudBridge.connectWallet !== 'function') {
          alert('Mud services not ready');
          return;
        }
        try {
          $(this).prop('disabled', true).val('Connecting...');
          await window.mudBridge.connectWallet();
          $(this).val('Wallet Connected');
        } catch (err) {
          console.error('[UI] wallet connect failed', err);
          alert('Failed to connect wallet. Please check MetaMask or injected provider.');
          $(this).prop('disabled', false).val('Connect Wallet');
        }
      });
    }
  });
  </script>
</body>
</html>
